name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go test ./...

  asr:
    name: ASR validator and importer parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: agentsessionrecord/asr
          path: asr
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: astral-sh/setup-uv@v10
      - name: Install the ASR validator
        run: pnpm --dir asr/tools/validator install --frozen-lockfile
      - name: Build entire-asr
        run: go build -o "$RUNNER_TEMP/bin/entire-asr" ./cmd/entire-asr
      - name: Validate every test output
        run: |
          ENTIRE_ASR_TEST_OUTPUT="$RUNNER_TEMP/test-output" go test -count=1 ./...
          node asr/tools/validator/bin/asr-validate.js --summary "$RUNNER_TEMP/test-output"
      - name: Compare with the ASR Entire importer
        run: |
          uv run --directory asr --package asr-entire python ../scripts/parity.py \
            --asr . --plugin "$RUNNER_TEMP/bin/entire-asr" --out "$RUNNER_TEMP/parity"
          node asr/tools/validator/bin/asr-validate.js --summary "$RUNNER_TEMP/parity/entire-asr"
